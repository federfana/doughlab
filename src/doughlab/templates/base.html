<!DOCTYPE html>
<html lang="it" x-data="{ dark: localStorage.getItem('dl-theme') === 'dark' || (localStorage.getItem('dl-theme') === null && matchMedia('(prefers-color-scheme: dark)').matches) }" :class="dark ? 'dark' : ''">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17100b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f0e4" media="(prefers-color-scheme: light)">
<title>{{ app_name }}</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<script>
  // Previene flash: applica il tema prima del render.
  (function(){
    try {
      var saved = localStorage.getItem('dl-theme');
      var dark = saved === 'dark' || (saved === null && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    } catch(e){}
  })();
</script>
<link rel="preload" href="/static/vendor/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v={{ css_version }}">
<script src="/static/vendor/alpine-3.14.3.min.js" defer></script>
<script src="/static/vendor/htmx-1.9.12.min.js"></script>
<script src="/static/vendor/chart-4.4.4.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="currentColor" opacity=".16"/><circle cx="16" cy="16" r="13.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="9.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/><circle cx="12.3" cy="12.6" r="2.1" fill="currentColor"/><circle cx="19.6" cy="13.8" r="1.7" fill="currentColor"/><circle cx="15.4" cy="19.7" r="2.3" fill="currentColor"/><circle cx="21" cy="20.2" r="1.2" fill="currentColor" opacity=".7"/></svg>
      <span class="brand-name">{{ app_name[:5] }}<b>{{ app_name[5:] }}</b></span>
    </span>
    <button class="toggle topbar-spacer" type="button" @click="dark = !dark; localStorage.setItem('dl-theme', dark ? 'dark' : 'light'); document.documentElement.classList.toggle('dark', dark)" :aria-label="dark ? 'Passa al tema chiaro' : 'Passa al tema scuro'">
      <svg x-show="!dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
      <svg x-show="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
    </button>
  </div>
</header>
<main class="app-main">
{% block content %}{% endblock %}
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/static/sw.js').catch(() => {}));
}
</script>
</body>
</html>
