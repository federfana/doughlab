<!DOCTYPE html>
<html lang="it" x-data="{ dark: localStorage.getItem('dl-theme') === 'dark' || (localStorage.getItem('dl-theme') === null && matchMedia('(prefers-color-scheme: dark)').matches) }" :class="dark ? 'dark' : ''">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1a16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)">
<title>{{ app_name }}</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<script>
  // Previene flash: applica il tema prima del render.
  (function(){
    try {
      var saved = localStorage.getItem('dl-theme');
      var dark = saved === 'dark' || (saved === null && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    } catch(e){}
  })();
</script>
<style>
:root {
  color-scheme: light dark;
  /* Palette chiara */
  --bg: #faf6ef;
  --surface: #ffffff;
  --surface-2: #f3ebdd;
  --border: #e4d6bf;
  --ink: #221811;
  --ink-2: #5c4a37;
  --mut: #79664c;
  --ac: #c2410c;        /* arancione terracotta */
  --ac-ink: #ffffff;
  --ac-soft: #fed7aa;
  --ok: #15803d;
  --warn: #b45309;
  --bad: #b91c1c;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --radius: 10px;
}
html.dark {
  --bg: #15110d;
  --surface: #221a14;
  --surface-2: #2b211a;
  --border: #3b2e23;
  --ink: #f5ede0;
  --ink-2: #c9b89a;
  --mut: #a8967c;
  --ac: #fb923c;
  --ac-ink: #1a0e05;
  --ac-soft: #4a2d12;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --shadow: 0 2px 6px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
a { color: var(--ac); }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-2 {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.btn {
  background: var(--ac);
  color: var(--ac-ink);
  border: 1px solid var(--ac);
  border-radius: 6px;
  padding: .5rem .9rem;
  font: 600 inherit;
  cursor: pointer;
  transition: filter .1s;
}
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.btn-ghost {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: .45rem .8rem;
  font: inherit;
  cursor: pointer;
}
.btn-ghost:hover { border-color: var(--ac); color: var(--ac); }
.btn-ghost.active {
  background: var(--ac-soft);
  color: var(--ac);
  border-color: var(--ac);
}
input, select, textarea {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: .4rem .55rem;
  font: inherit;
}
input:focus, select:focus { outline: 2px solid var(--ac); outline-offset: 1px; }
input[type=number] { width: 5.2rem; text-align: center; }
input[type=datetime-local] { width: auto; }
.number-stepper { display: inline-flex; align-items: stretch; gap: .25rem; }
.number-stepper input { width: 5.2rem; }
.number-stepper-controls { display: flex; flex-direction: column; gap: 2px; }
.number-stepper-controls button {
  width: 1.6rem;
  flex: 1;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--ink-2);
  font: 600 11px/1 system-ui, sans-serif;
  cursor: pointer;
}
.number-stepper-controls button:hover { color: var(--ac); border-color: var(--ac); }
@media (max-width: 560px), (pointer: coarse) {
  .number-stepper-controls button { width: 2.1rem; min-height: 1.55rem; font-size: 13px; }
}
.number-stepper input::-webkit-inner-spin-button,
.number-stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.number-stepper input[type=number] { -moz-appearance: textfield; }
label.field, div.field { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
label.field .lab, div.field .lab {
  font-size: .7rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--mut);
  font-weight: 600;
}
table { border-collapse: collapse; width: 100%; font-size: 14px; }
thead { background: var(--surface-2); color: var(--ink-2); }
th, td { padding: .45rem .5rem; text-align: center; }

tbody tr { border-top: 1px solid var(--border); }

.chip {

  align-items: center;
  gap: .3rem;
  padding: .2rem .55rem;

  font-size: .78rem;
  font-weight: 600;
  background: var(--ac-soft);
  color: var(--ac);
}

  border: 1px solid var(--border);
  border-radius: var(--radius);

  overflow: hidden;
}

}

}

.oven-profile-segments input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.oven-profile-segments span { display: block; padding: .28rem .55rem; border-radius: 4px; color: var(--ink-2); font-size: .76rem; font-weight: 600; }
.oven-profile-segments input:checked + span { background: var(--ac); color: var(--ac-ink); }

.result-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; min-width: 0; }

.preferment-split { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--border); font-size: .85rem; }

.chart-wrap { position: relative; height: clamp(240px, 36vw, 340px); }

.diary-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.diary-list { display: grid; gap: .8rem; }
.diary-card { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: .9rem; padding: .8rem; }

.stars-static { --fill: 0%; letter-spacing: .05em; background: linear-gradient(90deg, var(--warn) var(--fill), var(--border) var(--fill)); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1rem; white-space: nowrap; }

.flour-summary { display: grid; gap: .25rem; margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--border); font-size: .88rem; }
.flour-summary ul { margin: 0; padding-left: 1.1rem; }
.flour-advice { margin: .3rem 0 0; padding: .5rem .65rem; border-radius: 6px; background: var(--ac-soft); }
.flour-advice.sotto, .flour-advice.sopra { border: 1px solid var(--warn); }
.flour-advice .btn-ghost { margin-left: .4rem; padding: .15rem .6rem; min-height: 0; }
.live-dot { display: inline-block; width: .55rem; height: .55rem; margin-left: .4rem; border-radius: 50%; background: var(--ac); vertical-align: middle; }
.live-now { padding: 1.1rem; text-align: center; }
.live-now h2 { margin: .2rem 0 0; font-size: 1.4rem; }
.live-now .diary-actions { justify-content: center; }
.live-timer { margin: .3rem 0 0; font-size: clamp(2.6rem, 14vw, 4rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.live-timer.late { color: var(--bad); }
.live-bar { height: .45rem; margin: .7rem auto .6rem; max-width: 26rem; border-radius: 999px; background: var(--ac-soft); overflow: hidden; }
.live-bar span { display: block; height: 100%; background: var(--ac); transition: width 1s linear; }
.live-check { display: flex; gap: .55rem; align-items: flex-start; padding: .4rem 0; font-size: .95rem; }
.live-check input { margin-top: .2rem; }
.live-steps { margin: 0; padding-left: 1.3rem; display: grid; gap: .35rem; }
.live-steps li { color: var(--mut); }
.live-steps li.done { text-decoration: line-through; }
.live-steps li.current { color: var(--ink); font-weight: 700; text-decoration: none; }
.live-steps .hint { margin-left: .4rem; font-weight: 400; }

/* Grid helpers */
.grid { display: grid; gap: 1rem; }
.grid-planner { grid-template-columns: 1fr; }
@media (min-width: 980px) {
  .grid-planner { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); align-items: start; }
  .sticky-side { position: sticky; top: 72px; max-height: calc(100vh - 90px); overflow-y: auto; }
}
@media (max-width: 850px) {
  .dough-input-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .yeast-kind-control { grid-column: span 2; }
  .phase-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary-metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ingredient-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .dough-input-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; }
  .preset-layout { grid-template-columns: 1fr; gap: .5rem; }
  .section-heading { align-items: flex-start; flex-direction: column; }
  .phase-grid { grid-template-columns: 1fr; }
  .summary-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .85rem .5rem; }
  .ingredient-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .diary-card { grid-template-columns: 5.5rem minmax(0, 1fr); gap: .65rem; }
  .diary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  table { font-size: 12px; }
  th, td { padding: .35rem .12rem; }
  .summary-metrics > div, .ingredient-list > div { padding-left: .55rem; }
}
.space-y > * + * { margin-top: 1rem; }
.flex-wrap-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
</style>
<script src="/static/vendor/alpine-3.14.3.min.js" defer></script>
<script src="/static/vendor/htmx-1.9.12.min.js"></script>
<script src="/static/vendor/chart-4.4.4.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <strong style="color: var(--ac); font-size: 1.1rem">🍕 {{ app_name }}</strong>
    <span class="hint" style="margin-left:auto"></span>
    <button class="toggle" type="button" @click="dark = !dark; localStorage.setItem('dl-theme', dark ? 'dark' : 'light'); document.documentElement.classList.toggle('dark', dark)" :aria-label="dark ? 'Passa al tema chiaro' : 'Passa al tema scuro'">
      <span x-show="!dark">🌙</span>
      <span x-show="dark">☀️</span>
    </button>
  </div>
</header>
<main style="max-width: 1320px; margin: 0 auto; padding: 1rem; padding-bottom: 4rem;">
{% block content %}{% endblock %}
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/static/sw.js').catch(() => {}));
}
</script>
</body>
</html>
