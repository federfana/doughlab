[project]
name = "doughlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "federico.fanalista", email = "federico.fanalista@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.142.2",
    "ics>=0.7",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
doughlab = "doughlab:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["doughlab"]
mypy_path = ["src"]
